name: Portal quality
on:
  workflow_dispatch:
    inputs:
      speed:
        description: 'Save mobile and desktop Lighthouse lab reports'
        type: boolean
        default: false
  pull_request:
    paths: ['speech-site/src/**', 'speech-site/ask-runtime/**', 'speech-site/ask-public/**', 'speech-site/wrangler.ask.jsonc', 'speech-site/public/**', 'speech-site/scripts/**', 'speech-site/tests/**', 'speech-site/deployment/**/*.mjs', 'speech-site/*config*', 'speech-site/package*.json', 'speech-site/.npmrc', 'speech-site/.nvmrc', '.github/workflows/portal-quality.yml']
  push:
    paths: ['speech-site/src/**', 'speech-site/ask-runtime/**', 'speech-site/ask-public/**', 'speech-site/wrangler.ask.jsonc', 'speech-site/public/**', 'speech-site/scripts/**', 'speech-site/tests/**', 'speech-site/deployment/**/*.mjs', 'speech-site/*config*', 'speech-site/package*.json', 'speech-site/.npmrc', 'speech-site/.nvmrc', '.github/workflows/portal-quality.yml']
permissions:
  contents: read
jobs:
  ask-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: speech-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: speech-site/package-lock.json
      - run: npm ci
      - run: npm run test:ask-auth
      - run: npm run test:ask-content
      - run: node --test scripts/test-knowledge-catalogues.mjs
      - run: npm run build:ask
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: speech-site/package-lock.json
      - run: npm ci
      - name: Install browser runtimes with bounded mirror requests
        timeout-minutes: 6
        run: |
          # The hosted runner's Azure mirror stalled for 15 minutes on 1 Oct 2026.
          # Keep Ubuntu-signed packages; change only the mirror on this CI runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/80pinnacle-bounded-acquire >/dev/null
          npx playwright install --with-deps chromium firefox webkit
      - name: Select the current page acceptance contract
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {activeQualityPage,pageContracts} from './scripts/page-quality-contracts.mjs';
          const page=pageContracts[activeQualityPage];
          if(!page)throw Error('Unknown page acceptance contract');
          fs.appendFileSync(process.env.GITHUB_ENV,`PAGE_KIND=${activeQualityPage}\nPAGE_PATH=${page.path}\nCANONICAL_PATH=${page.canonical}\n`);
          JS
      - run: npm run check:page -- "$PAGE_KIND"
      - run: npx playwright test --project=firefox --project=webkit
      - run: npm run check:speed -- "$PAGE_KIND"
        if: github.event_name == 'workflow_dispatch' && inputs.speed
      - uses: actions/upload-artifact@v4
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.speed)
        with:
          name: portal-quality-findings
          path: speech-site/audits/
          retention-days: 7

      - name: Save multilingual book review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-book-review
          path: speech-site/audits/books-languages/
          if-no-files-found: ignore
          retention-days: 7
