name: Portal quality
on:
  workflow_dispatch:
    inputs:
      speed:
        description: 'Save mobile and desktop Lighthouse lab reports'
        type: boolean
        default: false
  pull_request:
    paths: ['build-window/**', 'speech-site/src/**', 'speech-site/ask-runtime/**', 'speech-site/ask-public/**', 'speech-site/wrangler.ask.jsonc', 'speech-site/public/**', 'speech-site/scripts/**', 'speech-site/tests/**', 'speech-site/deployment/**/*.mjs', 'speech-site/*config*', 'speech-site/package*.json', 'speech-site/.npmrc', 'speech-site/.nvmrc', '.github/workflows/portal-quality.yml']
  push:
    paths: ['build-window/**', 'speech-site/src/**', 'speech-site/ask-runtime/**', 'speech-site/ask-public/**', 'speech-site/wrangler.ask.jsonc', 'speech-site/public/**', 'speech-site/scripts/**', 'speech-site/tests/**', 'speech-site/deployment/**/*.mjs', 'speech-site/*config*', 'speech-site/package*.json', 'speech-site/.npmrc', 'speech-site/.nvmrc', '.github/workflows/portal-quality.yml']
permissions:
  contents: read
jobs:
  change-plan:
    runs-on: ubuntu-latest
    outputs:
      ask: ${{ steps.plan.outputs.ask }}
      portal: ${{ steps.plan.outputs.portal }}
      focused: ${{ steps.plan.outputs.focused }}
      scope: ${{ steps.plan.outputs.scope }}
      selection: ${{ steps.plan.outputs.selection }}
      needs_browser: ${{ steps.plan.outputs.needs_browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'build-window/.node-version'
      - id: plan
        name: Select affected acceptance gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            node speech-site/scripts/change-test-plan.mjs --full --base "$HEAD_SHA" --head "$HEAD_SHA"
          elif [ "$EVENT_NAME" = 'push' ] && [ "$REF_NAME" != 'main' ]; then
            # Use the complete branch delta, not only the last commit: a later
            # narrow fix must not hide earlier unpassed runtime changes.
            node speech-site/scripts/change-test-plan.mjs --base origin/main --head "$HEAD_SHA"
          else
            node speech-site/scripts/change-test-plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
  focused:
    needs: change-plan
    if: needs.change-plan.outputs.focused == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'build-window/.node-version'
      - name: Install dependencies for registered runtime fixtures
        if: needs.change-plan.outputs.scope == 'runtime'
        working-directory: speech-site
        run: npm ci
      - name: Install only requested fixture browser engines
        if: needs.change-plan.outputs.needs_browser == 'true'
        working-directory: speech-site
        timeout-minutes: 6
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/80pinnacle-bounded-acquire >/dev/null
          npx playwright install --with-deps chromium firefox webkit
      - name: Reuse only identical successful focused inputs
        uses: actions/cache@v4
        with:
          path: |
            speech-site/audits/change-testing
            speech-site/outputs/contact-receipt-20261015
          key: portal-focused-${{ runner.os }}-${{ hashFiles('build-window/.node-version', 'build-window/.npm-version', '.github/workflows/portal-quality.yml', 'speech-site/deployment/**', 'speech-site/scripts/**', 'speech-site/tests/fixtures/**', 'speech-site/src/lib/**', 'speech-site/src/data/**', 'speech-site/public/pinnacle-pages-scripts/**', 'speech-site/public/pinnacle-pages-data/**', 'speech-site/CHANGE-BASED-TESTING.md', 'speech-site/package*.json') }}-${{ github.run_id }}
          restore-keys: |
            portal-focused-${{ runner.os }}-${{ hashFiles('build-window/.node-version', 'build-window/.npm-version', '.github/workflows/portal-quality.yml', 'speech-site/deployment/**', 'speech-site/scripts/**', 'speech-site/tests/fixtures/**', 'speech-site/src/lib/**', 'speech-site/src/data/**', 'speech-site/public/pinnacle-pages-scripts/**', 'speech-site/public/pinnacle-pages-data/**', 'speech-site/CHANGE-BASED-TESTING.md', 'speech-site/package*.json') }}-
      - name: Run selected scope without building unrelated pages
        env:
          CHANGE_PLAN_JSON: ${{ needs.change-plan.outputs.selection }}
        run: |
          node --input-type=module - <<'JS'
          import {runFocused} from './speech-site/scripts/change-test-plan.mjs';
          const plan=JSON.parse(process.env.CHANGE_PLAN_JSON);
          if(!plan.focused||!['policy','control','runtime'].includes(plan.scope))throw Error('Unrecognized focused scope');
          console.log(JSON.stringify(runFocused(plan)));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-scope-evidence
          path: |
            speech-site/audits/change-testing/
            speech-site/outputs/contact-receipt-20261015/
          retention-days: 14
  ask-build:
    needs: change-plan
    if: needs.change-plan.outputs.ask == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: speech-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'build-window/.node-version'
          cache: npm
          cache-dependency-path: speech-site/package-lock.json
      - name: Use the shared npm version
        run: npm install --global "npm@$(cat ../build-window/.npm-version)" --no-audit --no-fund
      - run: npm ci
      - run: npm run test:ask-auth
      - run: npm run test:ask-content
      - name: Shared focused offline and launcher contracts
        run: node ../build-window/ci-focused.mjs
      - run: npm run build:ask
  checks:
    needs: change-plan
    env:
      CHANGE_PLAN_JSON: ${{ needs.change-plan.outputs.selection }}
    # Internal branches already run this exact source on push. Fork PRs retain
    # their untrusted checks; trusted push/dispatch remains the release gate.
    if: needs.change-plan.outputs.portal == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: portal-testingbot-builds
      cancel-in-progress: false
      queue: max
    timeout-minutes: 20
    defaults:
      run:
        working-directory: speech-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'build-window/.node-version'
          cache: npm
          cache-dependency-path: speech-site/package-lock.json
      - name: Use the shared npm version
        run: npm install --global "npm@$(cat ../build-window/.npm-version)" --no-audit --no-fund
      - run: npm ci
      - name: Install browser runtimes with bounded mirror requests
        timeout-minutes: 6
        run: |
          # The hosted runner's Azure mirror stalled for 15 minutes on 1 Oct 2026.
          # Keep Ubuntu-signed packages; change only the mirror on this CI runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/80pinnacle-bounded-acquire >/dev/null
          npx playwright install --with-deps chromium firefox webkit
      - name: Select the current page acceptance contract
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {activeQualityPage,pageContracts} from './scripts/page-quality-contracts.mjs';
          const plan=JSON.parse(process.env.CHANGE_PLAN_JSON),id=plan.pages?.[0]||activeQualityPage,page=pageContracts[id];
          if(!page)throw Error('Unknown page acceptance contract');
          fs.mkdirSync('audits/change-testing',{recursive:true});fs.writeFileSync('audits/change-testing/plan.json',JSON.stringify(plan));
          fs.appendFileSync(process.env.GITHUB_ENV,`PAGE_KIND=${id}\nPAGE_PATH=${page.path}\nCANONICAL_PATH=${page.canonical}\n`);
          JS
      - run: npm run check:page -- "$PAGE_KIND" --plan audits/change-testing/plan.json
      - run: node scripts/validate-centre-network.mjs
        if: needs.change-plan.outputs.scope != 'component'
      - run: npx playwright test --project=firefox --project=webkit
        if: needs.change-plan.outputs.scope != 'component'
      - name: Verify the shared announcement in the real Worker runtime
        if: needs.change-plan.outputs.scope != 'component'
        run: node scripts/check-site-announcement.mjs
      - name: Save shared announcement runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-announcement-runtime
          path: speech-site/outputs/site-announcement-20261012/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify shared asset compatibility and call behavior
        if: needs.change-plan.outputs.scope != 'component' || fromJSON(needs.change-plan.outputs.selection).extra.shared
        run: npm run test:shared-assets-repair
      - name: Verify original and minified enquiry/call behavior in browsers
        if: needs.change-plan.outputs.scope != 'component' || fromJSON(needs.change-plan.outputs.selection).extra.shared
        run: node scripts/check-shared-assets-browser.mjs
      - name: Verify regional service header and footer enquiry preferences
        if: needs.change-plan.outputs.scope != 'component' || fromJSON(needs.change-plan.outputs.selection).extra.regional
        run: node scripts/check-regional-paid-locality.mjs outputs/regional-paid-locality-20261017 --caller-only
      - name: Verify the durable contact browser journey without external intake
        if: needs.change-plan.outputs.scope != 'component' || fromJSON(needs.change-plan.outputs.selection).extra.contact
        run: node scripts/check-contact-receipt-browser.mjs
      - name: Save isolated contact journey evidence
        if: always() && (needs.change-plan.outputs.scope != 'component' || fromJSON(needs.change-plan.outputs.selection).extra.contact)
        uses: actions/upload-artifact@v4
        with:
          name: contact-receipt-browser
          path: speech-site/outputs/contact-receipt-20261015/
          if-no-files-found: error
          retention-days: 14
      - name: Save shared asset repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets-repair
          path: speech-site/outputs/semrush-assets-20261012/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:testingbot-contract
      - name: Offline tool evidence contracts
        run: python3 scripts/test-growth-evidence-profile.py
      - name: Start exact-build preview for TestingBot
        if: github.event_name != 'pull_request'
        run: |
          node scripts/serve-quality-preview.mjs > audits/testingbot-preview.log 2>&1 &
          echo $! > audits/testingbot-preview.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4340/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Changed centre gallery and Google feed regressions
        if: github.event_name != 'pull_request' && needs.change-plan.outputs.scope != 'component'
        env:
          CENTRE_TRUST_TEST_BASE: http://127.0.0.1:4340
          CENTRE_GOOGLE_TEST_BASE: http://127.0.0.1:4340
        run: |
          node scripts/validate-centre-trust-browser.mjs
          node scripts/validate-centre-google-browser.mjs
      - name: Connect TestingBot to this build
        if: github.event_name != 'pull_request'
        uses: testingbot/testingbot-tunnel-action@10358e89858c67a0e5c7aadb1b03ef0e2d320d20
        with:
          key: ${{ secrets.TESTINGBOT_KEY }}
          secret: ${{ secrets.TESTINGBOT_SECRET }}
          tunnelIdentifier: portal-${{ github.run_id }}-${{ github.run_attempt }}
          tbVersion: '5.0'
          fastFailRegexps: '^google-analytics\.com$,^www\.google-analytics\.com$,^region1\.google-analytics\.com$,^region2\.google-analytics\.com$,^googletagmanager\.com$,^www\.googletagmanager\.com$,^analytics\.google\.com$,^googleadservices\.com$,^www\.googleadservices\.com$,^pagead2\.googlesyndication\.com$,^googleads\.g\.doubleclick\.net$,^stats\.g\.doubleclick\.net$,^ad\.doubleclick\.net$,^td\.doubleclick\.net$,^google\.com$,^www\.google\.com$,^google\.co\.in$,^www\.google\.co\.in$,^clickguard\.com$,^www\.clickguard\.com$,^cdn\.clickguard\.com$,^api\.clickguard\.com$,^scripts\.clickguard\.com$,^protect\.pinnacleblooms\.org$,^ob\.aseasky\.link$,^www\.clarity\.ms$,^c\.clarity\.ms$,^static\.hotjar\.com$,^script\.hotjar\.com$,^connect\.facebook\.net$,^www\.facebook\.com$,^api\.whatsapp\.com$'
          noCache: true
          retryTimeout: 2
          readyTimeout: 90
          uploadLogFile: false
      - name: TestingBot BVT gates this exact build
        if: github.event_name != 'pull_request'
        env:
          TESTINGBOT_KEY: ${{ secrets.TESTINGBOT_KEY }}
          TESTINGBOT_SECRET: ${{ secrets.TESTINGBOT_SECRET }}
          TESTINGBOT_HUB: http://127.0.0.1:4445/wd/hub
          TESTINGBOT_BASE_URL: http://localhost:4340
          TESTINGBOT_TUNNEL_ID: portal-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run test:bvt -- --matrix chrome --visual --out audits/testingbot-build
          node scripts/assert-testingbot-release.mjs audits/testingbot-build/report.json
      - name: Declare pull-request cloud coverage boundary
        if: github.event_name == 'pull_request'
        run: echo 'Cloud BVT is required on the trusted source build before release. Pull-request code receives no TestingBot secrets; existing local browser tests still run.'
      - name: Save TestingBot build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testingbot-build-verification
          path: speech-site/audits/testingbot-build/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop exact-build preview
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f audits/testingbot-preview.pid ]; then kill "$(cat audits/testingbot-preview.pid)" || true; fi
      - run: npm run check:speed -- "$PAGE_KIND"
        if: github.event_name == 'workflow_dispatch' && inputs.speed
      - uses: actions/upload-artifact@v4
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.speed)
        with:
          name: portal-quality-findings
          path: speech-site/audits/
          retention-days: 7

      - name: Save multilingual book review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-book-review
          path: speech-site/audits/books-languages/
          if-no-files-found: ignore
          retention-days: 7
