name: Sitemap manager contracts
on:
  pull_request:
    paths: ['tooling/sitemap-manager/**', '.github/workflows/sitemap-manager.yml']
  push:
    branches: [main]
    paths: ['tooling/sitemap-manager/**', '.github/workflows/sitemap-manager.yml']
permissions:
  contents: read
jobs:
  catalogue-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tooling/sitemap-manager/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tooling/sitemap-manager/tests/asset-handler.test.mjs
